provider: meta-ai
name: Meta AI
description: Meta AI products (Meta AI chat, Llama).
aliases:
  - llama
sources:
  - name: v2fly
    type: remote-text
    url: https://cdn.jsdelivr.net/gh/v2fly/domain-list-community@master/data/meta
    parser: domain-list-community
    followIncludes: false
groups:
  - name: Core
    include:
      domain:
        - ai.meta.com
        # Meta Model API console, docs and API reference; served only to supported regions
        - ai.developer.meta.com
        # Redirects to ai.developer.meta.com
        - llama.developer.meta.com
        # Llama docs and model download hub; www.llama.com (already listed) now redirects here
        - developer.meta.com
        # Meta AI Demos
        - aidemos.meta.com
      domainSuffix:
        # Llama model weights download (signed URLs issued by the download form)
        - llamameta.net
    fromSource: true
patch:
  remove:
    domainSuffix:
      - meta.com
